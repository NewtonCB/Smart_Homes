name: renting_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  font_awesome_flutter:
  flutter_rating_bar:
#  fishbun:
  intl:
  animations:
  flutter_svg:
  get:
  form_validator:  # Form validation
  image_picker: ^0.8.4+4   # For profile picture (optional)
  google_maps_flutter:
  google_places_flutter:
  flutter_spinkit: ^5.2.1
  http: ^1.2.2
  animated_login: ^1.7.2
  intl_phone_number_input:
  photo_view: ^0.15.0
  firebase_core:
  flutter_cube: ^0.1.1
  cloud_firestore:
  firebase_storage:
  firebase_database: ^11.0.2
  geolocator: ^9.0.0
#  location: ^4.4.0  # Add this line
  firebase_auth:
  url_launcher: ^6.2.6
  shimmer:
  loading_animation_widget: ^1.2.1
  scroll_to_index:
#  multiple_images_picker:
#  multi_image_picker_view:
  cached_network_image: ^3.4.0
  carousel_slider: ^4.2.1
  flutter_swiper_null_safety:



dev_dependencies:
  flutter_test:
    sdk: flutter
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0
  flutter_rating_bar: ^4.0.0

#  flutter_gen:

#  integrations:
flutter_svg: true


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true


  assets:
    - assets/splash_covers/
    - assets/cube/
    - assets/img/
    - assets/icons/
    - assets/images/
    - assets/samples/ui/rive_app/rive/
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg





  fonts:
    - family: Billabong
      fonts:
        - asset: assets/fonts/Billabong.ttf

    - family: Raleway
      fonts:
      - asset: assets/fonts/Raleway-Regular.ttf
        weight: 400

      - asset: assets/fonts/Raleway-Medium.ttf
        weight: 500

      - asset: assets/fonts/Raleway-SemiBold.ttf
        weight: 600

